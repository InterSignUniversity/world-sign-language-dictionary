<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Video Dictionary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            width: 300px;
            margin: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
        img.flag {
            width: 30px;
            height: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Sign Language Video Dictionary</h1>
    <input type="text" id="search" placeholder="Search for a sign...">
    <div class="container" id="videoContainer">
        <div class="card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/dJvLqFMAvqc?autoplay=0&modestbranding=1&rel=0&showinfo=0&controls=0&disablekb=1&fs=0" allowfullscreen></iframe>
            <img src="flags/argentina.png" class="flag" alt="Argentina Flag">
            <p>Argentina</p>
        </div>
        <div class="card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/EXAMPLE2?autoplay=0&modestbranding=1&rel=0&showinfo=0&controls=0&disablekb=1&fs=0" allowfullscreen></iframe>
            <img src="flags/belgium.png" class="flag" alt="Belgium Flag">
            <p>Belgium</p>
        </div>
        <!-- Add more videos following this structure -->
    </div>

    <script>
        document.getElementById("search").addEventListener("input", function() {
            let filter = this.value.toLowerCase();
            let cards = document.querySelectorAll(".card");
            cards.forEach(card => {
                let keywords = card.getAttribute("data-keywords");
                if (keywords.includes(filter) || filter === "") {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
