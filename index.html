    <title>Sign Language Video Dictionary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;

        }
        .search-box {
            width: 60%;
            padding: 10px;

            margin-bottom: 20px;
        }
        .video-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .video-item {
            width: 250px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        iframe {
            width: 100%;
            height: 150px;
            border-radius: 5px;
        }
        .flag {
            width: 40px;
            height: auto;
            margin-top: 10px;
        }
        .country-name {
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
