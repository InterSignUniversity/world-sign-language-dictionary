<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Video Dictionary</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .search-bar { margin: 20px; padding: 10px; width: 50%; }
        .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .video-card { width: 300px; padding: 10px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        iframe { width: 100%; height: 200px; border-radius: 10px; }
        .flag { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Sign Language Video Dictionary</h1>
    <input type="text" class="search-bar" id="search" placeholder="Search for a sign..." onkeyup="filterVideos()">
    
    <div class="video-grid" id="videoContainer">
        <div class="video-card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/dJvLqFMAvqc?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3" allowfullscreen></iframe>
            <div class="flag">🇦🇷 Argentina</div>
        </div>
        <div class="video-card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/EMwWZBZjTrs?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3" allowfullscreen></iframe>
            <div class="flag">🇧🇪 Belgium</div>
        </div>
        <div class="video-card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/x5goj9fBHNs?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3" allowfullscreen></iframe>
            <div class="flag">🇩🇪 Germany</div>
        </div>
        <div class="video-card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/MsCCWGBNvOE?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3" allowfullscreen></iframe>
            <div class="flag">🇸🇸 South Sudan</div>
        </div>
        <div class="video-card" data-keywords="emotions mood feelings">
            <iframe src="https://www.youtube.com/embed/2z3ODeq4AoM?modestbranding=1&rel=0&showinfo=0&iv_load_policy=3" allowfullscreen></iframe>
            <div class="flag">🇺🇬 Uganda</div>
        </div>
    </div>

    <script>
        function filterVideos() {
            let searchQuery = document.getElementById("search").value.toLowerCase();
            let videos = document.querySelectorAll(".video-card");
            
            videos.forEach(video => {
                let keywords = video.getAttribute("data-keywords");
                if (keywords.includes(searchQuery) || searchQuery === "") {
                    video.style.display = "block";
                } else {
                    video.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
